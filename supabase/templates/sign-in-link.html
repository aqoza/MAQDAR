<h2>Sign in to MAQDAR</h2>
<p>
  Use this link to sign in. It works once and expires in one hour. If someone invited you to an
  organization, the invitation opens after you sign in.
</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
  >
    Sign in to MAQDAR
  </a>
</p>
<p>If you did not expect this email, you can ignore it.</p>
