name: Import original retention
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-retention
  cancel-in-progress: false
jobs:
  retain:
    if: vars.IMPORT_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/import-retention.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
