name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  web:
    name: Web (format, lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:logical
      - run: pnpm test
      - name: Onboarding delivery safety tests
        run: node --test scripts/onboarding-delivery.test.mjs

  supabase:
    name: Supabase (pgTAP, build, Playwright)
    runs-on: ubuntu-latest
    # The previous full run took 29m32s; retain all suites as calendar coverage grows.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (Postgres, Auth, REST, Storage, Mailpit)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
      - name: pgTAP
        run: pnpm exec supabase test db --local
      - name: Export local stack variables for the build and tests
        run: node scripts/write-env.mjs --github-env
      - name: Generated database types are current
        run: |
          node scripts/gen-types.mjs
          git diff --exit-code -- packages/shared/src/database.types.ts
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Synthetic data generates, validates and loads into the stack
        working-directory: engine
        run: |
          uv sync --locked
          uv run maqdar-synth all --preset tiny --force
          uv run pytest -m db -q
        env:
          MAQDAR_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Import retention unit tests
        run: node --test scripts/import-retention.test.mjs
      - name: Build web
        run: pnpm --filter web build
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: pnpm --filter web test:e2e
      - name: Package Cloudflare Worker (no deployment)
        run: pnpm --filter web cf:build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --locked
      - run: uv run pytest

  simulation-container:
    name: Simulation container (build, non-root, fail-closed bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Build the native scoped worker without publishing
        run: docker build --platform linux/amd64 -f engine/Dockerfile.simulation -t simulation-worker:ci .
      - name: Restricted user and safe startup failure
        run: |
          test "$(docker inspect simulation-worker:ci --format '{{.Config.User}}')" = worker
          set +e
          docker run --rm --network none simulation-worker:ci > bootstrap.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -Fx 'Simulation bootstrap failed: check verified connection and CA.' bootstrap.log
          test "$(wc -l < bootstrap.log)" = 1
      - name: Start isolated CI database
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
      - name: Real image probe, scoped publication and lease recovery
        run: uv run --project engine pytest engine/tests/test_scoped_container_db.py -q
        env:
          MAQDAR_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MAQDAR_CONTAINER_IMAGE: simulation-worker:ci
          MAQDAR_TEST_DB_CONTAINER: supabase_db_MAQDAR
      - name: Stop CI database
        if: always()
        run: pnpm exec supabase stop --no-backup
