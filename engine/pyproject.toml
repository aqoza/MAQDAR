[project]
name = "zeespare-engine"
version = "0.1.0"
description = "ZeeSpare planning engine: demand classification, forecasting and inventory policy jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
    "statsforecast==2.1.1",
    "threadpoolctl==3.7.0",
]

[project.scripts]
zeespare-engine = "zeespare_engine:main"
zeespare-worker = "zeespare_engine.worker:main"
zeespare-simulation-worker = "zeespare_engine.scoped_worker:main"
zeespare-synth = "zeespare_engine.synth.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "statistical: slower statistical checks on the medium preset",
    "db: needs the local Supabase stack (set ZEESPARE_TEST_DSN); skipped otherwise",
]
