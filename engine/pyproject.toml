[project]
name = "maqdar-engine"
version = "0.1.0"
description = "MAQDAR planning engine: demand classification, forecasting and inventory policy jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
maqdar-engine = "maqdar_engine:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
