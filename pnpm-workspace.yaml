packages:
  - apps/*
  - packages/*

engineStrict: true

# pnpm 12 refuses to run dependency install scripts until they are reviewed.
# These ship prebuilt binaries as optional dependencies; their scripts
# are download fallbacks only, so they stay denied.
allowBuilds:
  unrs-resolver: false
  '@swc/core': false
  '@parcel/watcher': false
  esbuild: false
  workerd: false

minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
  - vite@8.3.4

# @swc/core 1.16 refuses its native-binding cache under %LOCALAPPDATA% on Windows machines with
# MSIX apps installed (swc-project/swc#12442), which breaks next-intl's plugin at config load.
# Pin the transitive dependency to the last 1.15 release until upstream fixes it.
overrides:
  '@swc/core': 1.15.47
  # SheetJS stopped publishing to npm at 0.18.5, which has unfixed CVEs (prototype pollution,
  # ReDoS). The web app takes 0.20.3 from the official CDN tarball; this keeps any registry `xlsx`
  # from resolving, directly or transitively. Bump both together (apps/web/package.json).
  xlsx: https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

# Next.js 16.4 loads .next/server/preview-props.json, which @opennextjs/cloudflare 1.20.10 does not
# inline, so every server-rendered route crashes on Workers (opennextjs/opennextjs-cloudflare#1355).
# This adds the file to the inlined manifests, as upstream PR #1356 does. Drop it once released.
patchedDependencies:
  '@opennextjs/cloudflare@1.20.10': patches/@opennextjs__cloudflare@1.20.10.patch
